# Fork CI (docs/fork/DESIGN.md, "CI/CD"). Runs on pull requests only: main takes changes through pull requests that
# must pass the "ci" check and be up to date, so a commit on main has already been tested and fork-release.yml only
# builds it. Heavy jobs run only for the parts a pull request touches; a docs-only one runs the gate alone (seconds).
# The upstream workflows (build, release, ...) are disabled in this repository, not edited, so upstream merges stay clean.
name: fork-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.diff.outputs.agent }}
      android: ${{ steps.diff.outputs.android }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then files=$(git diff --name-only "$BASE"...HEAD); else files=$(git ls-files); fi # manual run: all
          has() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          ci='^\.github/'
          {
            echo "agent=$(has "^agent/|$ci")"
            echo "android=$(has "^android/(build\.gradle|settings\.gradle|gradle|app/(build\.gradle|src/(main/(java|res|AndroidManifest)|test)))|$ci")"
            echo "web=$(has "^android/app/src/main/assets/www/|^agent/PhoneBox\.Agent/(settings\.html|widgets\.json|templates\.json)|^tools/(pages|ui-tests|fork)/|$ci")"
          } >> "$GITHUB_OUTPUT"
          printf 'changed:\n%s\n' "$files"

  checks:
    name: Logic tests and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tools/fork/test/*.test.mjs
      - run: python3 tools/check-release.py

  agent:
    name: Agent unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('agent/**/*.csproj') }}
      - run: dotnet test agent/PhoneBox.Agent.Tests --nologo

  android:
    name: Android app (lint, unit tests, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --console=plain
      - run: python3 tools/test-agent-stream.py

  ui:
    name: UI tests (panel and settings in a browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ui-tests/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tools/ui-tests/package-lock.json') }}
      - working-directory: tools/ui-tests
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: tools/ui-tests
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-test-report
          path: tools/ui-tests/test-results/
          retention-days: 7

  # The one required status check of main: green when every job that ran passed (skipped ones count as passed).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, checks, agent, android, ui]
    if: always()
    steps:
      - run: |
          echo '${{ toJSON(needs.*.result) }}'
          ! grep -qE 'failure|cancelled' <<<'${{ join(needs.*.result, ' ') }}'
