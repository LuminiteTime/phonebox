# Fork: every push to main that touches the agent or the app becomes a release of this fork, numbered
# <upstream version>.<run number>. The agent's own updater (Updates.Repo = this fork) picks it up and updates
# itself, and the app updates itself from the agent over USB or Wi-Fi (docs/fork/DESIGN.md, "Updates").
# Only the Mac agent (osx-arm64) and the APK are built: the fork runs on one Mac and one tablet.
name: fork-release

on:
  push:
    branches: [main]
    paths: ['agent/PhoneBox.Agent/**', 'android/**', '.github/workflows/fork-release.yml']
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/PhoneBox.Agent/PhoneBox.Agent.csproj | head -n1)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts | head -n1)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=$((code * 1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

  apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.PHONEBOX_KEYSTORE_BASE64 }}
          PHONEBOX_STORE_FILE: ${{ runner.temp }}/release.keystore
          PHONEBOX_STORE_PASSWORD: ${{ secrets.PHONEBOX_STORE_PASSWORD }}
          PHONEBOX_KEY_ALIAS: ${{ secrets.PHONEBOX_KEY_ALIAS }}
          PHONEBOX_KEY_PASSWORD: ${{ secrets.PHONEBOX_KEY_PASSWORD }}
          PHONEBOX_FORK_VERSION: ${{ needs.version.outputs.version }}
          PHONEBOX_FORK_CODE: ${{ needs.version.outputs.code }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$PHONEBOX_STORE_FILE"
          trap 'rm -f "$PHONEBOX_STORE_FILE"' EXIT
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/PhoneBox-$PHONEBOX_FORK_VERSION.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/

  agent:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish (self-contained, single file)
        run: dotnet publish agent/PhoneBox.Agent -c Release -f net10.0 -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ needs.version.outputs.version }} -o out --nologo
      - uses: ./.github/actions/sign-macos-agent
        with:
          binary: out/PhoneBoxAgent
          p12-base64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      - name: Smoke test
        run: python3 tools/smoke-agent.py out/PhoneBoxAgent --version '${{ needs.version.outputs.version }}'
      - name: Zip
        run: |
          mkdir -p dist
          (cd out && zip -qr "../dist/PhoneBoxAgent-${{ needs.version.outputs.version }}-osx-arm64.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent
          path: dist/

  publish:
    needs: [version, apk, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          sha256sum * > "SHA256SUMS-$V.txt"
          gh release create "v$V" * -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "PhoneBox fork $V" --notes "Built from ${{ github.sha }}. Installed automatically by the agent."
